# Changelog entries. The page sorts by date, newest first. Entries with the same date keep the order they have in this file (first in file = first on page).
#
# Fields:
#   date     (required) YYYY-MM-DD
#   title    (required) short title
#   level    (required) important | normal
#   summary  (required) one or two sentences (Markdown allowed)
#   docs     (optional) list of doc file names, e.g. [saving-tokens.md]
#   commit   (optional) commit hash, or a full URL
#   diff     (optional) before/after text; lines starting with + or - are coloured
#
# The newest "important" entry is also shown as a banner on the home page.

- date: 2026-10-13
  title: Install Matt's skills from his own marketplace
  level: important
  summary: "The official marketplace is behind (version 1.2.3, Matt is at 1.3.1). If you installed from it, remove that copy, install from the `mattpocock` marketplace, and turn on auto-update."
  docs: [matt-pocock-skills.md]
  diff: |
    - claude plugin install mattpocock-skills@claude-plugins-official
    + claude plugin marketplace add mattpocock/skills
    + claude plugin install mattpocock-skills@mattpocock

